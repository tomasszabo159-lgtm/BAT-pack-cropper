<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Mode Batch Cropper</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <div id="root"></div>
    
    <script type="text/babel">
        const { useState, useRef } = React;

        // --- ICONS ---
        const Upload = (props) => (
            <svg {...props} fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2">
                <path strokeLinecap="round" strokeLinejoin="round" d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/>
            </svg>
        );
        const Copy = (props) => (
            <svg {...props} fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2">
                <path strokeLinecap="round" strokeLinejoin="round" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/>
            </svg>
        );
        const Download = (props) => (
            <svg {...props} fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2">
                <path strokeLinecap="round" strokeLinejoin="round" d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/>
            </svg>
        );
        const X = (props) => (
            <svg {...props} fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2">
                <path strokeLinecap="round" strokeLinejoin="round" d="M18 6L6 18M6 6l12 12"/>
            </svg>
        );
        const Check = (props) => (
            <svg {...props} fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2">
                <path strokeLinecap="round" strokeLinejoin="round" d="M20 6L9 17l-5-5"/>
            </svg>
        );
        const Trash2 = (props) => (
            <svg {...props} fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2">
                <path strokeLinecap="round" strokeLinejoin="round" d="M3 6h18M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2M10 11v6M14 11v6"/>
            </svg>
        );

        function SnusBatchAutoCrop() {
            const [images, setImages] = useState([]);
            const [processing, setProcessing] = useState(false);
            const [pasteActive, setPasteActive] = useState(false);
            // State for Tabs: 'modern', 'fmc', 'ppt'
            const [activeTab, setActiveTab] = useState('modern');
            
            const fileInputRef = useRef(null);
            const pasteAreaRef = useRef(null);

            // Mapping for display names
            const tabNames = {
                'modern': 'Modern Oral',
                'fmc': 'FMC / HP',
                'ppt': 'PPT'
            };

            // --- SCANNING LOGIC ---

            const getRawBounds = (imageData, width, height) => {
                let minX = width, maxX = 0, minY = height, maxY = 0;
                let foundPixels = false;

                const isContent = (r, g, b, a) => {
                    const brightness = (r + g + b) / 3;
                    const isBackground = brightness > 250 && Math.abs(r - g) < 5 && Math.abs(g - b) < 5 && a > 250;
                    return !isBackground && a > 10;
                };

                for (let y = 0; y < height; y++) {
                    for (let x = 0; x < width; x++) {
                        const i = (y * width + x) * 4;
                        if (isContent(imageData[i], imageData[i+1], imageData[i+2], imageData[i+3])) {
                            minY = Math.min(minY, y);
                            maxY = Math.max(maxY, y);
                            minX = Math.min(minX, x);
                            maxX = Math.max(maxX, x);
                            foundPixels = true;
                        }
                    }
                }

                if (!foundPixels) return null;

                return { minX, maxX, minY, maxY };
            };

            const calculateCrop = (imageData, width, height, mode) => {
                if (mode === 'ppt') {
                    return { x: 0, y: 0, width: width, height: height };
                }

                const raw = getRawBounds(imageData, width, height);
                
                if (!raw) return { x: 0, y: 0, width: width, height: height };

                let { minX, maxX, minY, maxY } = raw;

                if (mode === 'modern') {
                    const padding = 3;
                    minX = Math.max(0, minX - padding);
                    maxX = Math.min(width - 1, maxX + padding);
                    minY = Math.max(0, minY - padding);
                    maxY = Math.min(height - 1, maxY + padding);

                    const w = maxX - minX + 1;
                    const h = maxY - minY + 1;
                    const aspectRatio = w / h;

                    if (aspectRatio > 0.85 && aspectRatio < 1.15) {
                        const size = Math.max(w, h);
                        const centerX = minX + w / 2;
                        const centerY = minY + h / 2;
                        return {
                            x: Math.max(0, Math.floor(centerX - size / 2)),
                            y: Math.max(0, Math.floor(centerY - size / 2)),
                            width: Math.min(size, width),
                            height: Math.min(size, height)
                        };
                    }
                    return { x: minX, y: minY, width: w, height: h };
                }

                if (mode === 'fmc') {
                    const w = maxX - minX + 1;
                    const h = maxY - minY + 1;
                    return { x: minX, y: minY, width: w, height: h };
                }

                return { x: 0, y: 0, width: width, height: height };
            };

            const processImage = (file) => {
                return new Promise((resolve) => {
                    const reader = new FileReader();
                    
                    reader.onload = (e) => {
                        const img = new Image();
                        img.onload = () => {
                            const canvas = document.createElement('canvas');
                            canvas.width = img.width;
                            canvas.height = img.height;
                            const ctx = canvas.getContext('2d');
                            ctx.drawImage(img, 0, 0);
                            
                            const imageData = ctx.getImageData(0, 0, img.width, img.height);
                            const bounds = calculateCrop(imageData.data, img.width, img.height, activeTab);
                            
                            const cropCanvas = document.createElement('canvas');
                            cropCanvas.width = bounds.width;
                            cropCanvas.height = bounds.height;
                            const cropCtx = cropCanvas.getContext('2d');
                            
                            cropCtx.drawImage(
                                img,
                                bounds.x, bounds.y, bounds.width, bounds.height,
                                0, 0, bounds.width, bounds.height
                            );
                            
                            resolve({
                                id: Date.now() + Math.random(),
                                original: img.src,
                                cropped: cropCanvas.toDataURL('image/png'),
                                mode: activeTab,
                                copied: false
                            });
                        };
                        img.src = e.target.result;
                    };
                    
                    reader.readAsDataURL(file);
                });
            };

            const processMultipleImages = async (files) => {
                setProcessing(true);
                const fileArray = Array.from(files);
                const processed = [];
                
                for (const file of fileArray) {
                    if (file.type.startsWith('image/')) {
                        const result = await processImage(file);
                        processed.push(result);
                    }
                }
                
                setImages(prev => [...prev, ...processed]);
                setProcessing(false);
            };

            const handleFileChange = (e) => {
                const files = e.target.files;
                if (files && files.length > 0) {
                    processMultipleImages(files);
                }
            };

            const handlePaste = async (e) => {
                const items = e.clipboardData?.items;
                if (!items) return;
                
                const files = [];
                for (let item of items) {
                    if (item.type.startsWith('image/')) {
                        const file = item.getAsFile();
                        if (file) files.push(file);
                    }
                }
                
                if (files.length > 0) {
                    await processMultipleImages(files);
                    setPasteActive(false);
                }
            };

            const handleDrop = (e) => {
                e.preventDefault();
                const files = e.dataTransfer.files;
                if (files && files.length > 0) {
                    processMultipleImages(files);
                }
            };

            const copyToClipboard = async (image) => {
                try {
                    const base64Response = await fetch(image.cropped);
                    const blob = await base64Response.blob();
                    
                    if (navigator.clipboard && window.ClipboardItem) {
                        await navigator.clipboard.write([
                            new ClipboardItem({ 'image/png': blob })
                        ]);
                        
                        setImages(prev => prev.map(img => 
                            img.id === image.id ? { ...img, copied: true } : img
                        ));
                        
                        setTimeout(() => {
                            setImages(prev => prev.map(img => 
                                img.id === image.id ? { ...img, copied: false } : img
                            ));
                        }, 2000);
                    } else {
                        alert('Copy to clipboard is not supported in your browser.');
                    }
                } catch (err) {
                    console.error('Failed to copy:', err);
                    alert('Failed to copy image.');
                }
            };

            const downloadImage = (image) => {
                const link = document.createElement('a');
                link.download = `${image.mode}-pack-${image.id}.png`;
                link.href = image.cropped;
                link.click();
            };

            const downloadAll = () => {
                images.forEach((image, index) => {
                    setTimeout(() => {
                        const link = document.createElement('a');
                        link.download = `${image.mode}-pack-${index + 1}.png`;
                        link.href = image.cropped;
                        link.click();
                    }, index * 200);
                });
            };

            return (
                <div className="min-h-screen bg-gradient-to-br from-slate-50 to-slate-100 p-8">
                    <div className="max-w-7xl mx-auto">
                        <div className="text-center mb-8">
                            <h1 className="text-4xl font-bold text-slate-800 mb-2">Multi-Mode Batch Cropper</h1>
                            <p className="text-slate-600">Select your mode, then drop or paste images.</p>
                        </div>

                        {/* --- TABS --- */}
                        <div className="flex justify-center mb-6">
                            <div className="bg-white p-1 rounded-xl shadow-sm border border-slate-200 inline-flex">
                                <button
                                    onClick={() => setActiveTab('modern')}
                                    className={`px-6 py-2 rounded-lg text-sm font-semibold transition-all ${
                                        activeTab === 'modern' 
                                        ? 'bg-blue-600 text-white shadow-md' 
                                        : 'text-slate-600 hover:bg-slate-50'
                                    }`}
                                >
                                    Modern Oral
                                    <span className="block text-[10px] font-normal opacity-80">Smart Crop + Square</span>
                                </button>
                                <button
                                    onClick={() => setActiveTab('fmc')}
                                    className={`px-6 py-2 rounded-lg text-sm font-semibold transition-all ${
                                        activeTab === 'fmc' 
                                        ? 'bg-blue-600 text-white shadow-md' 
                                        : 'text-slate-600 hover:bg-slate-50'
                                    }`}
                                >
                                    FMC / HP
                                    <span className="block text-[10px] font-normal opacity-80">Tight Crop (No Border)</span>
                                </button>
                                <button
                                    onClick={() => setActiveTab('ppt')}
                                    className={`px-6 py-2 rounded-lg text-sm font-semibold transition-all ${
                                        activeTab === 'ppt' 
                                        ? 'bg-blue-600 text-white shadow-md' 
                                        : 'text-slate-600 hover:bg-slate-50'
                                    }`}
                                >
                                    PPT
                                    <span className="block text-[10px] font-normal opacity-80">No Crop (Storage)</span>
                                </button>
                            </div>
                        </div>

                        {/* --- UPLOAD AREA --- */}
                        <div className="grid md:grid-cols-2 gap-4 mb-8">
                            <div 
                                onDrop={handleDrop}
                                onDragOver={(e) => e.preventDefault()}
                                className={`border-4 border-dashed rounded-2xl p-12 text-center bg-white transition-colors cursor-pointer ${
                                    activeTab === 'ppt' ? 'border-purple-300 hover:border-purple-400' : 'border-blue-300 hover:border-blue-400'
                                }`}
                                onClick={() => fileInputRef.current?.click()}
                            >
                                <Upload className={`w-12 h-12 mx-auto mb-4 ${activeTab === 'ppt' ? 'text-purple-500' : 'text-blue-500'}`} />
                                <p className="text-lg text-slate-700 mb-2 font-semibold">
                                    Upload for <span className="uppercase">{tabNames[activeTab]}</span>
                                </p>
                                <p className="text-sm text-slate-500">Click or Drag & Drop</p>
                                <input 
                                    ref={fileInputRef} 
                                    type="file" 
                                    accept="image/*" 
                                    multiple 
                                    onChange={handleFileChange} 
                                    style={{display: 'none'}} 
                                />
                            </div>

                            <div 
                                ref={pasteAreaRef}
                                tabIndex={0}
                                onPaste={handlePaste}
                                onFocus={() => setPasteActive(true)}
                                onBlur={() => setPasteActive(false)}
                                className={`border-4 border-dashed rounded-2xl p-12 text-center bg-white cursor-pointer transition-colors ${
                                    pasteActive 
                                        ? 'border-green-500 bg-green-50' 
                                        : 'border-green-300 hover:border-green-400'
                                }`}
                                onClick={() => pasteAreaRef.current?.focus()}
                            >
                                <Copy className="w-12 h-12 mx-auto mb-4 text-green-500" />
                                <p className="text-lg text-slate-700 mb-2 font-semibold">Paste Images</p>
                                <p className="text-sm text-slate-500">Click here, then Ctrl+V</p>
                            </div>
                        </div>

                        {processing && (
                            <div className="bg-white rounded-2xl p-8 text-center mb-8 shadow-sm">
                                <div className="animate-spin rounded-full h-12 w-12 border-4 border-slate-200 border-t-blue-600 mx-auto mb-4"></div>
                                <p className="text-slate-600">Processing...</p>
                            </div>
                        )}

                        {images.length > 0 && (
                            <div className="mb-8">
                                <div className="flex justify-between items-center mb-4">
                                    <h2 className="text-2xl font-bold text-slate-800">Results ({images.length})</h2>
                                    <div className="flex gap-2">
                                        <button onClick={downloadAll} className="flex items-center gap-2 px-4 py-2 bg-slate-800 hover:bg-slate-900 text-white rounded-lg transition-colors">
                                            <Download className="w-4 h-4" /> Download All
                                        </button>
                                        <button onClick={() => setImages([])} className="flex items-center gap-2 px-4 py-2 bg-red-100 hover:bg-red-200 text-red-700 rounded-lg transition-colors">
                                            <Trash2 className="w-4 h-4" /> Clear
                                        </button>
                                    </div>
                                </div>

                                <div className="grid md:grid-cols-2 lg:grid-cols-4 gap-6">
                                    {images.map((image) => (
                                        <div key={image.id} className="bg-white rounded-xl p-3 shadow-lg flex flex-col">
                                            <div className="flex justify-between items-center mb-2 px-1">
                                                <span className={`text-[10px] uppercase font-bold px-2 py-1 rounded ${
                                                    image.mode === 'modern' ? 'bg-blue-100 text-blue-700' :
                                                    image.mode === 'fmc' ? 'bg-orange-100 text-orange-700' :
                                                    'bg-purple-100 text-purple-700'
                                                }`}>
                                                    {tabNames[image.mode]}
                                                </span>
                                                <button onClick={() => setImages(prev => prev.filter(i => i.id !== image.id))} className="text-slate-400 hover:text-red-500">
                                                    <X className="w-4 h-4" />
                                                </button>
                                            </div>
                                            
                                            <div className="relative flex-grow bg-slate-50 border-2 border-slate-100 rounded-lg overflow-hidden mb-3 flex items-center justify-center min-h-[200px]">
                                                <img src={image.cropped} alt="Result" className="max-h-[250px] w-auto object-contain" />
                                            </div>
                                            
                                            <div className="flex gap-2 mt-auto">
                                                <button onClick={() => copyToClipboard(image)} className={`flex-1 flex items-center justify-center gap-2 px-3 py-2 rounded-lg text-sm font-medium transition-colors ${
                                                    image.copied ? 'bg-green-600 text-white' : 'bg-slate-100 hover:bg-slate-200 text-slate-700'
                                                }`}>
                                                    {image.copied ? <Check className="w-4 h-4" /> : <Copy className="w-4 h-4" />}
                                                    {image.copied ? 'Copied' : 'Copy'}
                                                </button>
                                                <button onClick={() => downloadImage(image)} className="px-3 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg">
                                                    <Download className="w-4 h-4" />
                                                </button>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        ReactDOM.render(<SnusBatchAutoCrop />, document.getElementById('root'));
    </script>
</body>
</html>
